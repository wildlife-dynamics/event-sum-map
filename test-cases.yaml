      until: "2026-07-31T23:59:59"
      timezone:
        label: "Africa/Nairobi (UTC+03:00)"
        tzCode: "Africa/Nairobi"
        name: "(UTC+03:00) Nairobi"
        utc: "+03:00"
    get_events_data:
      event_types: ["gfwgladalert"]
    groupers:
