id: patrol_event_sum_map

requirements:
  # DEV ONLY: local editable ecoscope on branch ltd-patrol-density-weighting,
  # which carries the optional-sum-mode calculate_feature_density change plus
  # the process_events_details / drop_column_prefix platform promotions.
  # Before publish, revert to a released ecoscope-platform pin that includes
  # that branch (> 2.17.0). Run dev/postcompile-editable.sh after every
  # compile (pydantic + platform patches), then test with --frozen.
  - name: ecoscope
    path: /Users/yunwu/MEP/wt-tasks/ecoscope
    editable: true
    extras: ["platform", "mapping", "analysis"]
  # Editable-mode conda pins (see ecoscope-spec.md "editable dev-mode pitfalls"):
  # ecoscope requires lonboard ==0.0.8, which only exists as the conda build on
  # the ecoscope-workflows channel — pin it there so uv never resolves lonboard
  # from PyPI. numpy is pinned strictly by ecoscope; pydeck 0.9.2 as usual
  # (wildlife-dynamics/wt#167).
  - name: lonboard
    version: "==0.0.8"
    channel: https://repo.prefix.dev/ecoscope-workflows/
  - name: numpy
    version: ">=2,<2.1"
    channel: conda-forge
  # ecoscope-earthranger-io-core (git v0.0.21) requires pyarrow <24; without
  # this pin the conda solve picks a newer pyarrow and the pypi solve conflicts.
  - name: pyarrow
    version: ">=20,<24"
    channel: conda-forge
  # rasterio from conda (GDAL native libs); <1.5 keeps libgdal below the
  # version that conflicts with lonboard 0.0.8 -> pyogrio. PyPI rasterio 1.5.0
  # has no osx-arm64 wheel, so uv would otherwise try (and fail) an sdist build.
  - name: rasterio
    version: ">=1.3,<1.5"
    channel: conda-forge
  - name: pydeck
    version: "0.9.2"
    channel: conda-forge

rjsf-overrides:
  properties:
    get_events_data.properties.event_types.ecoscope:transform:
      - transformer: EarthRangerEnumResolver
        transformer_kws:
          type: event_type
          depends_on: properties.er_client_name.properties.data_source.properties.name
    get_events_data.properties.event_types.description: >-
      Specify the event type(s) to analyze (optional). Leave this section empty to analyze all event types.

    # --- Group Data: grouper override (labeled Category dropdown + Time) ---
    "Group Data.properties.groupers.title": ""
    "Group Data.properties.groupers.properties.groupers.description": ""
    "Group Data.properties.groupers.properties.groupers.ecoscope:transform":
      - transformer: EarthRangerEnumResolver
        transformer_kws:
          type: spatial_feature_group
          depends_on: properties.er_client_name.properties.data_source.properties.name
    "Group Data.properties.groupers.properties.groupers.items.anyOf":
      - {"$ref": "#/$defs/ValueGrouper"}
      - {"$ref": "#/$defs/TemporalGrouper"}
      - {"$ref": "#/$defs/SpatialGrouper"}

    "base_map_defs.properties.base_maps.default":
      - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"
        opacity: 1.0
      - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
        opacity: 0.5

    # --- Event Sum Map: aggregate column + grid options ---
    "Event Sum Map.properties.agg_column.title": ""
    "Event Sum Map.properties.agg_column.properties.var.title": "Aggregate Column"
    "Event Sum Map.properties.agg_column.properties.var.description": >-
      Event details field whose values are totaled per grid cell, using the field title
      shown in EarthRanger (for example Number of Animals). Leave empty to count events
      per cell instead.
    "Event Sum Map.properties.density_grid_options.title": ""

    # --- Filter Data: location filter card ---
    "Filter Data.properties.filter_events.title": ""
    "Filter Data.properties.filter_events.properties.bounding_box.description": >-
      Only include events whose coordinates fall inside this bounding box.
    "Filter Data.properties.filter_events.properties.filter_point_coords.description": >-
      Exclude events recorded at these exact coordinates (e.g. known bad GPS fixes).

  $defs:
    ValueGrouper:
      title: "Category"
      type: "object"
      properties:
        index_name:
          title: "Index Name"
          type: "string"
          oneOf:
            - const: "event_type"
              title: "Event Type"
            - const: "event_category"
              title: "Event Category"
            - const: "reported_by_name"
              title: "Reported By"

  uiSchema:
    get_events_data.event_types.items.ui:help: >-
      If you are on Ecoscope Desktop, "Event Type" values can be found in your EarthRanger Admin site under Activity → Event Types.
    base_map_defs.base_maps.items.ui:options.label: false
    Filter Data.filter_events.filter_point_coords.items.ui:options.label: false
    # Grid Cell Size union: hide the per-branch heading + duplicate inner
    # discriminator select (same pattern as patrol-efforts / subject-tracking).
    "Event Sum Map.density_grid_options.auto_scale_or_custom_cell_size":
      anyOf:
        - ui:help: Auto-scale for an optimized grid cell size based on the workflow data or Customize to set a specific grid cell size.
          ui:options:
            label: false
          auto_scale_or_custom:
            ui:widget: hidden
        - ui:options:
            label: false
          auto_scale_or_custom:
            ui:widget: hidden
      auto_scale_or_custom:
        ui:widget: hidden

task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped

workflow:
  # ---------- Setup ----------
  - name: Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Data Source
    id: er_client_name
    task: set_er_connection

  - name: Time Range
    id: time_range
    task: set_time_range
    partial:
      time_format: '%d %b %Y %H:%M:%S %Z'

  - name: Extract Timezone Selection
    id: get_timezone
    task: get_timezone_from_time_range
    partial:
      time_range: ${{ workflow.time_range.return }}

  # ---------- Data Fetching (events only — no patrols) ----------
  - name: Event Types
    id: get_events_data
    task: get_events
    partial:
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      event_columns:
        - id
        - time
        - event_type
        - event_category
        - reported_by
        - serial_number
        - event_details
        - geometry
      include_null_geometry: false
      raise_on_empty: false
      include_details: true
      include_updates: false
      include_related_events: false
      include_display_values: true
      force_point_geometry: true

  # ---------- Process Events ----------
  - name: Convert Events to Timezone
    id: convert_events_tz
    task: convert_values_to_timezone
    partial:
      df: ${{ workflow.get_events_data.return }}
      timezone: ${{ workflow.get_timezone.return }}
      columns:
        - time
      auto_detect: false

  - name: Extract Reported By Name
    id: extract_reported_by
    task: extract_value_from_json_column
    partial:
      df: ${{ workflow.convert_events_tz.return }}
      column_name: reported_by
      field_name_options:
        - name
      output_type: str
      output_column_name: reported_by_name

  # Details chain (wt-download-events pattern): resolve event_details against
  # the ER event-type schemas (keys -> display titles, enums -> labels), then
  # flatten into top-level columns so the user-chosen Aggregate Column is
  # addressable by the display title shown in EarthRanger.
  - name: Process Event Details
    id: process_event_details
    task: process_events_details
    partial:
      df: ${{ workflow.extract_reported_by.return }}
      client: ${{ workflow.er_client_name.return }}
      map_to_titles: true
      ordered: true

  - name: Normalize Event Details
    id: normalize_event_details
    task: normalize_json_column
    partial:
      df: ${{ workflow.process_event_details.return }}
      column: event_details
      skip_if_not_exists: true
      sort_columns: false

  # Collision-safe prefix removal: a details field that shadows a core column
  # (e.g. "time") gets a _1 suffix instead of silently duplicating.
  - name: Remove Event Details Prefix
    id: drop_event_details_prefix
    task: drop_column_prefix
    partial:
      df: ${{ workflow.normalize_event_details.return }}
      prefix: event_details__
      duplicate_strategy: suffix

  - name: Convert Event Detail Datetimes to Timezone
    id: convert_event_details_timezone
    task: convert_values_to_timezone
    partial:
      df: ${{ workflow.drop_event_details_prefix.return }}
      timezone: ${{ workflow.get_timezone.return }}
      columns: []
      auto_detect: true

  # ---------- Filter Data ----------
  - title: Filter Data
    type: task-group
    description: " "
    tasks:
      - name: Event Location Filter
        id: filter_events
        task: apply_reloc_coord_filter
        partial:
          df: ${{ workflow.convert_event_details_timezone.return }}
          roi_gdf: null
          roi_name: null
          reset_index: true

  # ---------- Group Data ----------
  - title: Group Data
    type: task-group
    description: >-
      Configure how events are grouped (by category or temporal index) and split
      into per-group dashboard views.
    tasks:
      - name: Group Data
        id: groupers
        task: set_groupers

  # Spatial groupers: fetch the selected spatial feature groups from ER and
  # resolve them onto the grouper specs (events workflow pattern).
  - task: extract_spatial_grouper_feature_group_names
    id: spatial_group_ids
    partial:
      groupers: ${{ workflow.groupers.return }}

  - task: get_spatial_features_group
    id: fetch_all_spatial_feature_groups
    partial:
      client: ${{ workflow.er_client_name.return }}
    map:
      argnames: spatial_features_group_name
      argvalues: ${{ workflow.spatial_group_ids.return }}

  - task: resolve_spatial_feature_groups_for_spatial_groupers
    id: resolved_groupers
    skipif:
      conditions:
        - never
    partial:
      groupers: ${{ workflow.groupers.return }}
      spatial_feature_groups: ${{ workflow.fetch_all_spatial_feature_groups.return }}

  - name: Add Temporal Index to Events
    id: events_add_temporal_index
    task: add_temporal_index
    partial:
      df: ${{ workflow.filter_events.return }}
      time_col: time
      groupers: ${{ workflow.resolved_groupers.return }}
      cast_to_datetime: true
      format: mixed

  - name: Add Spatial Index to Events
    id: events_add_spatial_index
    task: add_spatial_index
    partial:
      gdf: ${{ workflow.events_add_temporal_index.return }}
      groupers: ${{ workflow.resolved_groupers.return }}

  - name: Map Title
    id: set_map_title
    task: set_string_var
    partial:
      var: "Event Sum Map"

  # Standalone card — base layers for the map.
  - name: Map Base Layers
    id: base_map_defs
    task: set_base_maps

  - name: Split Events by Group
    id: split_event_groups
    task: split_groups
    partial:
      df: ${{ workflow.events_add_spatial_index.return }}
      groupers: ${{ workflow.resolved_groupers.return }}

  # ---------- Event Sum Map (gridded totals) ----------
  - title: Event Sum Map
    type: task-group
    description: >-
      Grid heatmap that totals a chosen event value — or counts events — per cell.
    tasks:
      # Declared first so the card renders Aggregate Column above the grid
      # options' Advanced Configurations accordion (card order = task order).
      - name: Aggregate Column
        id: agg_column
        task: set_optional_string_var

      - name: Density Grid Options
        id: density_grid_options
        task: set_density_grid_options
        # opacity / cell size / crs are all ecoscope:advanced -> the card's single
        # Advanced Configurations accordion.
        partial:
          intersecting_only: false

      # Invisible extractor: opacity for the heatmap polygon layer.
      - name: Heatmap Layer Opacity
        id: heatmap_opacity
        task: get_opacity_from_combined_params
        partial:
          combined_params: ${{ workflow.density_grid_options.return }}

      - name: Event Meshgrid
        id: events_meshgrid
        task: call_meshgrid_from_combined_params
        skipif:
          conditions:
            - any_is_empty_df
            - any_dependency_skipped
            - all_geometry_are_none
        partial:
          aoi: ${{ workflow.events_add_spatial_index.return }}
          combined_params: ${{ workflow.density_grid_options.return }}

      # Empty Aggregate Column -> sum_column "" -> the task counts events per
      # cell (optional sum mode in calculate_feature_density itself).
      - name: Calculate Event Totals per Cell
        id: grouped_event_density
        task: calculate_feature_density
        partial:
          meshgrid: ${{ workflow.events_meshgrid.return }}
          geometry_type: point
          sum_column: ${{ workflow.agg_column.return }}
        mapvalues:
          argnames: geodataframe
          argvalues: ${{ workflow.split_event_groups.return }}

      - name: Sort Event Totals
        id: esm_sorted
        task: sort_values
        partial:
          column_name: density
          ascending: true
          na_position: last
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.grouped_event_density.return }}

      - name: Drop NaN Cells
        id: esm_drop_nan
        task: drop_nan_values_by_column
        partial:
          column_name: density
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.esm_sorted.return }}

      - name: Classify Event Totals
        id: esm_classify
        task: apply_classification
        partial:
          input_column_name: density
          output_column_name: density_bins
          classification_options:
            scheme: equal_interval
            k: 10
          label_options:
            label_ranges: true
            label_decimals: 0
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.esm_drop_nan.return }}

      - name: Event Total Colormap
        id: esm_colormap
        task: apply_color_map
        partial:
          input_column_name: density_bins
          colormap: RdYlGn_r
          output_column_name: density_colormap
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.esm_classify.return }}

      # Invisible: tooltip/column label — the Aggregate Column name when one is
      # set, else "Total" (count mode).
      - name: Total Column Label
        id: esm_total_label
        task: default_if_string_is_empty
        partial:
          value: ${{ workflow.agg_column.return }}
          default: "Total"

      # Invisible: legend title — "<label> per Grid Cell".
      - name: Legend Title
        id: esm_legend_title
        task: concat_string_vars
        partial:
          values:
            - ${{ workflow.esm_total_label.return }}
            - " per Grid Cell"

      - name: Rename Event Total Output
        id: esm_rename
        task: map_columns
        partial:
          drop_columns: []
          retain_columns: []
          rename_columns:
            density: ${{ workflow.esm_total_label.return }}
          raise_if_not_found: true
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.esm_colormap.return }}

      - name: Create Event Sum Polygon Layer
        id: esm_layer
        task: create_polygon_layer
        skipif:
          conditions:
            - any_is_empty_df
            - any_dependency_skipped
            - all_geometry_are_none
        partial:
          layer_style:
            fill_color_column: density_colormap
            get_line_width: 0
            opacity: ${{ workflow.heatmap_opacity.return }}
          legend:
            label_column: density_bins
            color_column: density_colormap
          tooltip_columns:
            - ${{ workflow.esm_total_label.return }}
        mapvalues:
          argnames: geodataframe
          argvalues: ${{ workflow.esm_rename.return }}

      - name: Draw Event Sum Ecomap
        id: esm_ecomap
        task: draw_ecomap
        partial:
          title: null
          tile_layers: ${{ workflow.base_map_defs.return }}
          north_arrow_style:
            placement: top-left
          legend_style:
            title: ${{ workflow.esm_legend_title.return }}
            format_title: false
            placement: bottom-right
          static: false
          max_zoom: 20
          widget_id: ${{ workflow.set_map_title.return }}
        mapvalues:
          argnames: geo_layers
          argvalues: ${{ workflow.esm_layer.return }}

      - name: Persist Event Sum Ecomap
        id: esm_html
        task: persist_text
        partial:
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: event_sum_map
        mapvalues:
          argnames: text
          argvalues: ${{ workflow.esm_ecomap.return }}

      - name: Create Event Sum Map Widget
        id: esm_widget
        task: create_map_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: ${{ workflow.set_map_title.return }}
        map:
          argnames: [view, data]
          argvalues: ${{ workflow.esm_html.return }}

      - name: Merge Event Sum Map Views
        id: esm_widget_merged
        task: merge_widget_views
        partial:
          widgets: ${{ workflow.esm_widget.return }}

  # ---------- Dashboard ----------
  - name: Create Dashboard
    id: event_sum_dashboard
    task: gather_dashboard
    partial:
      details: ${{ workflow.workflow_details.return }}
      widgets:
        - ${{ workflow.esm_widget_merged.return }}
      groupers: ${{ workflow.resolved_groupers.return }}
      time_range: ${{ workflow.time_range.return }}
